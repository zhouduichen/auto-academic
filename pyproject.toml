[project]
name = "auto-academic"
version = "0.1.0"
description = "Mac control client and shared API contract for AutoResearch Workbench"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.16,<1",
]

[project.scripts]
arw = "arw.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "numpy>=2.5.1",
  "peft>=0.20.0",
  "pillow>=12.3.0",
  "pytest>=8.4,<9",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "scipy>=1.18.0",
  "torch>=2.13.0",
  "torchvision>=0.28.0",
  "transformers>=5.14.1",
  "types-pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arw"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "stage_a1: pinned inactive ARIS vendor snapshot gate",
  "stage_a2: development-safe ARIS activation gate",
  "stage_a2_integration: real ARIS installer lifecycle gate (requires ARW_RUN_STAGE_A2_INTEGRATION=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"tools/**/*.py" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["arw"]
