[project]
name = "auto-academic"
version = "0.1.0"
description = "Mac control client and shared API contract for AutoResearch Workbench"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
arw = "arw.cli:app"
arw-server = "arw_server.main:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0,<7",
]
gpu = [
  "cryptography>=42",
  "torch>=2.4",
  "torchvision>=0.19",
  "transformers>=4.45",
  "peft>=0.13",
  "numpy>=2.0",
  "huggingface_hub",
  "pillow",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arw", "src/arw_server"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "stage_a1: pinned inactive ARIS vendor snapshot gate",
  "stage_a2: development-safe ARIS activation gate",
  "stage_a2_integration: real ARIS installer lifecycle gate (requires ARW_RUN_STAGE_A2_INTEGRATION=1)",
  "stage_c: Windows server gate",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"tools/**/*.py" = ["S101", "S603", "S607"]
"src/arw_server/**/*.py" = ["B008", "S104", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["arw", "arw_server"]
